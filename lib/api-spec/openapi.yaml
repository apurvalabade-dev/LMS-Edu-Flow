openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LMS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: courses
    description: Course management
  - name: modules
    description: Course modules
  - name: lessons
    description: Course lessons
  - name: enrollments
    description: Enrollment operations
  - name: quizzes
    description: Quiz operations
  - name: progress
    description: Progress tracking
  - name: dashboard
    description: Dashboard aggregates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [student, instructor, admin]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # COURSES
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: instructorId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"

    post:
      operationId: createCourse
      tags: [courses]
      summary: Create course (instructor/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course by ID with modules and lessons
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found

    patch:
      operationId: updateCourse
      tags: [courses]
      summary: Update course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /courses/{id}/publish:
    patch:
      operationId: publishCourse
      tags: [courses]
      summary: Publish or unpublish a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishInput"
      responses:
        "200":
          description: Course with updated published state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  # MODULES
  /courses/{courseId}/modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List modules for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

    post:
      operationId: createModule
      tags: [modules]
      summary: Create module
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Created module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

  /modules/{id}:
    patch:
      operationId: updateModule
      tags: [modules]
      summary: Update module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpdate"
      responses:
        "200":
          description: Updated module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"

    delete:
      operationId: deleteModule
      tags: [modules]
      summary: Delete module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # LESSONS
  /modules/{moduleId}/lessons:
    get:
      operationId: listLessons
      tags: [lessons]
      summary: List lessons for a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"

    post:
      operationId: createLesson
      tags: [lessons]
      summary: Create lesson
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: Created lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

  /lessons/{id}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          description: Not found

    patch:
      operationId: updateLesson
      tags: [lessons]
      summary: Update lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonUpdate"
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"

    delete:
      operationId: deleteLesson
      tags: [lessons]
      summary: Delete lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ENROLLMENTS
  /courses/{id}/enroll:
    post:
      operationId: enrollCourse
      tags: [enrollments]
      summary: Enroll in a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "409":
          description: Already enrolled

  /courses/{id}/unenroll:
    delete:
      operationId: unenrollCourse
      tags: [enrollments]
      summary: Unenroll from a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unenrolled

  /my-courses:
    get:
      operationId: getMyCourses
      tags: [enrollments]
      summary: Get courses the current user is enrolled in
      responses:
        "200":
          description: Enrolled courses with progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrolledCourse"

  /courses/{id}/students:
    get:
      operationId: getCourseStudents
      tags: [enrollments]
      summary: Get students enrolled in a course (instructor/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of enrolled students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"

  # PROGRESS
  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      tags: [progress]
      summary: Mark a lesson as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"

  /courses/{id}/progress:
    get:
      operationId: getCourseProgress
      tags: [progress]
      summary: Get current user's progress in a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"

  # QUIZZES
  /lessons/{lessonId}/quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List quizzes for a lesson
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"

    post:
      operationId: createQuiz
      tags: [quizzes]
      summary: Create quiz for a lesson
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "201":
          description: Created quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"

  /quizzes/{id}:
    get:
      operationId: getQuiz
      tags: [quizzes]
      summary: Get quiz with questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetail"
        "404":
          description: Not found

    delete:
      operationId: deleteQuiz
      tags: [quizzes]
      summary: Delete quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /quizzes/{id}/submit:
    post:
      operationId: submitQuiz
      tags: [quizzes]
      summary: Submit quiz answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /quizzes/{id}/questions:
    post:
      operationId: createQuestion
      tags: [quizzes]
      summary: Add question to quiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"

  /questions/{id}:
    delete:
      operationId: deleteQuestion
      tags: [quizzes]
      summary: Delete question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # DASHBOARD
  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Student dashboard stats
      responses:
        "200":
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /dashboard/instructor:
    get:
      operationId: getInstructorDashboard
      tags: [dashboard]
      summary: Instructor dashboard stats
      responses:
        "200":
          description: Instructor dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # AUTH
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [student, instructor]
          default: student

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # USER
    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, instructor, admin]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        createdAt:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [student, instructor, admin]
        bio:
          type: string
        avatarUrl:
          type: string

    UserList:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # COURSE
    Course:
      type: object
      required: [id, title, description, instructorId, category, published, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        instructorId:
          type: integer
        instructorName:
          type: ["string", "null"]
        category:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        published:
          type: boolean
        totalLessons:
          type: integer
        enrollmentCount:
          type: integer
        createdAt:
          type: string

    CourseInput:
      type: object
      required: [title, description, category]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        thumbnailUrl:
          type: string

    CourseUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        thumbnailUrl:
          type: string

    PublishInput:
      type: object
      required: [published]
      properties:
        published:
          type: boolean

    CourseList:
      type: object
      required: [courses, total, page, limit]
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CourseDetail:
      type: object
      required: [id, title, description, instructorId, category, published, modules, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        instructorId:
          type: integer
        instructorName:
          type: ["string", "null"]
        category:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        published:
          type: boolean
        enrollmentCount:
          type: integer
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleWithLessons"
        createdAt:
          type: string

    # MODULE
    Module:
      type: object
      required: [id, courseId, title, order, createdAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
        createdAt:
          type: string

    ModuleWithLessons:
      type: object
      required: [id, courseId, title, order, lessons, createdAt]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/Lesson"
        createdAt:
          type: string

    ModuleInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        order:
          type: integer

    ModuleUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        order:
          type: integer

    # LESSON
    Lesson:
      type: object
      required: [id, moduleId, title, type, order, createdAt]
      properties:
        id:
          type: integer
        moduleId:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [video, text, quiz]
        videoUrl:
          type: ["string", "null"]
        content:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        order:
          type: integer
        createdAt:
          type: string

    LessonInput:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 1
        type:
          type: string
          enum: [video, text, quiz]
        videoUrl:
          type: string
        content:
          type: string
        duration:
          type: integer
        order:
          type: integer

    LessonUpdate:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [video, text, quiz]
        videoUrl:
          type: string
        content:
          type: string
        duration:
          type: integer
        order:
          type: integer

    # ENROLLMENT
    Enrollment:
      type: object
      required: [id, userId, courseId, enrolledAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        courseId:
          type: integer
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        enrolledAt:
          type: string

    EnrolledCourse:
      type: object
      required: [courseId, title, category, enrolledAt, progressPercent, completedLessons, totalLessons]
      properties:
        courseId:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        instructorName:
          type: ["string", "null"]
        enrolledAt:
          type: string
        progressPercent:
          type: number
        completedLessons:
          type: integer
        totalLessons:
          type: integer

    # PROGRESS
    Progress:
      type: object
      required: [id, userId, lessonId, completed, completedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        lessonId:
          type: integer
        completed:
          type: boolean
        completedAt:
          type: string

    CourseProgress:
      type: object
      required: [courseId, totalLessons, completedLessons, progressPercent, completedLessonIds]
      properties:
        courseId:
          type: integer
        totalLessons:
          type: integer
        completedLessons:
          type: integer
        progressPercent:
          type: number
        completedLessonIds:
          type: array
          items:
            type: integer

    # QUIZ
    Quiz:
      type: object
      required: [id, lessonId, title, createdAt]
      properties:
        id:
          type: integer
        lessonId:
          type: integer
        title:
          type: string
        passingScore:
          type: integer
        timeLimitMinutes:
          type: ["integer", "null"]
        createdAt:
          type: string

    QuizInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        passingScore:
          type: integer
          default: 70
        timeLimitMinutes:
          type: integer

    QuizDetail:
      type: object
      required: [id, lessonId, title, passingScore, questions, createdAt]
      properties:
        id:
          type: integer
        lessonId:
          type: integer
        title:
          type: string
        passingScore:
          type: integer
        timeLimitMinutes:
          type: ["integer", "null"]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        createdAt:
          type: string

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"

    QuizAnswer:
      type: object
      required: [questionId, selectedOption]
      properties:
        questionId:
          type: integer
        selectedOption:
          type: integer

    QuizResult:
      type: object
      required: [quizId, score, passed, totalQuestions, correctAnswers]
      properties:
        quizId:
          type: integer
        score:
          type: number
        passed:
          type: boolean
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/QuestionFeedback"

    QuestionFeedback:
      type: object
      required: [questionId, correct, correctOption]
      properties:
        questionId:
          type: integer
        correct:
          type: boolean
        correctOption:
          type: integer

    # QUESTION
    Question:
      type: object
      required: [id, quizId, question, options, order]
      properties:
        id:
          type: integer
        quizId:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string
        correctOption:
          type: ["integer", "null"]
        explanation:
          type: ["string", "null"]
        order:
          type: integer

    QuestionInput:
      type: object
      required: [question, options, correctOption]
      properties:
        question:
          type: string
          minLength: 1
        options:
          type: array
          items:
            type: string
          minItems: 2
        correctOption:
          type: integer
        explanation:
          type: string
        order:
          type: integer

    # DASHBOARD
    StudentDashboard:
      type: object
      required: [enrolledCourses, completedCourses, totalLessonsCompleted, recentActivity]
      properties:
        enrolledCourses:
          type: integer
        completedCourses:
          type: integer
        totalLessonsCompleted:
          type: integer
        averageProgress:
          type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        upcomingCourses:
          type: array
          items:
            $ref: "#/components/schemas/EnrolledCourse"

    InstructorDashboard:
      type: object
      required: [totalCourses, publishedCourses, totalStudents, totalLessons, courseStats]
      properties:
        totalCourses:
          type: integer
        publishedCourses:
          type: integer
        totalStudents:
          type: integer
        totalLessons:
          type: integer
        courseStats:
          type: array
          items:
            $ref: "#/components/schemas/CourseStats"
        recentEnrollments:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"

    AdminDashboard:
      type: object
      required: [totalUsers, totalCourses, totalEnrollments, totalLessons, usersByRole, recentUsers, topCourses]
      properties:
        totalUsers:
          type: integer
        totalCourses:
          type: integer
        totalEnrollments:
          type: integer
        totalLessons:
          type: integer
        usersByRole:
          $ref: "#/components/schemas/UsersByRole"
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"
        topCourses:
          type: array
          items:
            $ref: "#/components/schemas/CourseStats"

    UsersByRole:
      type: object
      required: [student, instructor, admin]
      properties:
        student:
          type: integer
        instructor:
          type: integer
        admin:
          type: integer

    CourseStats:
      type: object
      required: [courseId, title, enrollmentCount, completionRate]
      properties:
        courseId:
          type: integer
        title:
          type: string
        category:
          type: string
        enrollmentCount:
          type: integer
        completionRate:
          type: number
        totalLessons:
          type: integer

    ActivityItem:
      type: object
      required: [type, description, createdAt]
      properties:
        type:
          type: string
          enum: [enrollment, lesson_complete, quiz_passed, quiz_failed]
        description:
          type: string
        courseTitle:
          type: ["string", "null"]
        createdAt:
          type: string
